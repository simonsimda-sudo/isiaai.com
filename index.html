<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISIA AI | Work in progress</title>
    <meta
      name="description"
      content="ISIA AI is getting ready. Our new startup website is currently a work in progress."
    />
    <meta property="og:title" content="ISIA AI | Work in progress" />
    <meta
      property="og:description"
      content="Our new startup website is currently a work in progress."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.isiaai.com/" />
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --ink: #101317;
        --muted: #69727d;
        --line: #e8edf2;
        --accent: #21a67a;
        --accent-strong: #137b5b;
        --panel: #111827;
        --panel-soft: #1f2937;
        --code: #d7fbe8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono",
          Menlo, monospace;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .landing {
        width: min(1040px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
        align-items: center;
        gap: clamp(28px, 6vw, 72px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 34px;
        color: var(--muted);
        font-size: clamp(12px, 1.45vw, 15px);
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.45;
        max-width: 640px;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        color: var(--ink);
        font-size: clamp(48px, 8vw, 92px);
        line-height: 0.94;
        font-weight: 800;
        letter-spacing: 0;
      }

      .subtitle {
        max-width: 520px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(17px, 2vw, 20px);
        line-height: 1.55;
      }

      .site {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 36px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 15px;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(33, 166, 122, 0.13);
      }

      .code-gif {
        width: min(100%, 420px);
        aspect-ratio: 1 / 1;
        justify-self: end;
        display: grid;
        place-items: center;
        position: relative;
      }

      .code-window {
        width: min(100%, 360px);
        border: 1px solid #202a38;
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
        box-shadow:
          0 24px 70px rgba(16, 19, 23, 0.16),
          0 1px 0 rgba(255, 255, 255, 0.7) inset;
        transform: rotate(-2deg);
        animation: float 3.2s ease-in-out infinite;
      }

      .window-bar {
        height: 38px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 14px;
        background: var(--panel-soft);
        border-bottom: 1px solid #263244;
      }

      .window-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #ef6262;
      }

      .window-dot:nth-child(2) {
        background: #f4bd50;
      }

      .window-dot:nth-child(3) {
        background: #58c878;
      }

      .code-lines {
        margin: 0;
        min-height: 248px;
        padding: 26px 22px 24px;
        color: var(--code);
        font:
          600 16px / 1.8 "SFMono-Regular", Consolas, "Liberation Mono",
          Menlo, monospace;
        white-space: pre-wrap;
      }

      .line {
        display: block;
        width: max-content;
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
        animation: typing 6s steps(26, end) infinite both;
      }

      .line:nth-child(1) {
        color: #8bd5ff;
        animation-delay: 0s;
      }

      .line:nth-child(2) {
        color: #d7fbe8;
        animation-delay: 0.7s;
      }

      .line:nth-child(3) {
        color: #ffc777;
        animation-delay: 1.4s;
      }

      .line:nth-child(4) {
        color: #c4b5fd;
        animation-delay: 2.1s;
      }

      .cursor {
        display: inline-block;
        width: 10px;
        height: 1.15em;
        margin-left: 3px;
        vertical-align: -0.16em;
        background: var(--accent);
        animation: blink 0.9s steps(2, start) infinite;
      }

      .spark {
        position: absolute;
        width: 12px;
        height: 12px;
        border: 2px solid var(--accent);
        border-left: 0;
        border-bottom: 0;
        opacity: 0;
        animation: spark 3.2s ease-in-out infinite;
      }

      .spark.one {
        top: 12%;
        right: 9%;
      }

      .spark.two {
        bottom: 15%;
        left: 13%;
        animation-delay: 1.1s;
      }

      @keyframes typing {
        0%,
        12% {
          width: 0;
          opacity: 0.55;
        }

        34%,
        74% {
          width: 100%;
          opacity: 1;
        }

        92%,
        100% {
          width: 0;
          opacity: 0.55;
        }
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }

        50% {
          transform: translateY(-12px) rotate(1deg);
        }
      }

      @keyframes spark {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.7) rotate(45deg);
        }

        35%,
        65% {
          opacity: 1;
          transform: scale(1) rotate(45deg);
        }
      }

      @media (max-width: 780px) {
        main {
          min-height: auto;
          padding: 32px 18px 46px;
        }

        .landing {
          min-height: calc(100vh - 78px);
          grid-template-columns: 1fr;
          align-content: center;
          gap: 34px;
        }

        .brand {
          margin-bottom: 26px;
        }

        .site {
          margin-top: 28px;
        }

        .code-gif {
          justify-self: start;
          width: min(100%, 350px);
        }

        .code-window {
          width: min(100%, 320px);
        }

        .code-lines {
          min-height: 218px;
          padding: 22px 18px 20px;
          font-size: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="landing" aria-label="ISIA AI work in progress">
        <div>
          <div class="brand">
            <span>
              Institute of Sustainable Innovation and Applied Artificial
              Intelligence
            </span>
          </div>
          <h1>Work in progress</h1>
          <p class="subtitle">
            Our new startup website is currently being built. Something useful
            is loading here soon.
          </p>
          <div class="site">
            <span class="status-dot" aria-hidden="true"></span>
            <span>www.isiaai.com</span>
          </div>
        </div>

        <div class="code-gif" aria-label="Animated programming illustration">
          <span class="spark one" aria-hidden="true"></span>
          <span class="spark two" aria-hidden="true"></span>
          <div class="code-window" aria-hidden="true">
            <div class="window-bar">
              <span class="window-dot"></span>
              <span class="window-dot"></span>
              <span class="window-dot"></span>
            </div>
            <pre class="code-lines"><span class="line">const startup = "ISIA AI";</span>
<span class="line">await build(product);</span>
<span class="line">deploy.whenReady();</span>
<span class="line">console.log("soon");<span class="cursor"></span></span></pre>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
